<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>120 Day Journey</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      padding: 50px 20px;
    }

    h1 {
      font-size: 36px;
    }

    .dates {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.7;
    }

    #day {
      font-size: 28px;
      font-weight: bold;
      margin-top: 30px;
    }

    #percentage {
      font-size: 22px;
      margin-top: 15px;
    }

    .progress-container {
      width: 80%;
      max-width: 700px;
      height: 30px;
      background-color: #ddd;
      border-radius: 20px;
      margin: 30px auto;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: green;
      transition: width 1s ease;
    }

    #remaining {
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>120 Day Journey</h1>

  <div class="dates">
    <div id="startDate"></div>
    <div id="endDate"></div>
  </div>

  <div id="day"></div>

  <div id="percentage"></div>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="remaining"></div>


  <script>

    // -------------------------
    // SETTINGS
    // -------------------------

    const TOTAL_DAYS = 120;

    const START_YEAR = 2026;

    // JavaScript months start at 0
    // January = 0
    // September = 8
    const START_MONTH = 8;

    const START_DAY = 13;


    // -------------------------
    // CREATE START DATE
    // -------------------------

    const startDate = new Date(
      START_YEAR,
      START_MONTH,
      START_DAY
    );


    // -------------------------
    // CALCULATE END DATE
    // -------------------------

    const endDate = new Date(startDate);

    // Day 1 is Sept 13, so Day 120 is
    // 119 days after the start date.
    endDate.setDate(
      endDate.getDate() + TOTAL_DAYS - 1
    );


    // -------------------------
    // GET TODAY'S DATE
    // -------------------------

    const today = new Date();


    // -------------------------
    // CONVERT DATES TO UTC
    // -------------------------

    const startUTC = Date.UTC(
      startDate.getFullYear(),
      startDate.getMonth(),
      startDate.getDate()
    );

    const todayUTC = Date.UTC(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


    // -------------------------
    // CALCULATE DAYS
    // -------------------------

    const millisecondsPerDay =
      1000 * 60 * 60 * 24;


    let daysElapsed = Math.floor(
      (todayUTC - startUTC) /
      millisecondsPerDay
    );


    if (daysElapsed < 0) {
      daysElapsed = 0;
    }


    if (daysElapsed > TOTAL_DAYS) {
      daysElapsed = TOTAL_DAYS;
    }


    const currentDay =
      Math.min(
        daysElapsed + 1,
        TOTAL_DAYS
      );


    const percentage =
      (daysElapsed / TOTAL_DAYS) * 100;


    const daysRemaining =
      TOTAL_DAYS - daysElapsed;


    // -------------------------
    // FORMAT DATES
    // -------------------------

    const dateOptions = {
      month: "long",
      day: "numeric",
      year: "numeric"
    };


    // -------------------------
    // DISPLAY
    // -------------------------

    document.getElementById("startDate").textContent =
      "Start: " +
      startDate.toLocaleDateString(
        "en-US",
        dateOptions
      );


    document.getElementById("endDate").textContent =
      "Day 120: " +
      endDate.toLocaleDateString(
        "en-US",
        dateOptions
      );


    document.getElementById("day").textContent =
      "Day " +
      currentDay +
      " of " +
      TOTAL_DAYS;


    document.getElementById("percentage").textContent =
      percentage.toFixed(1) +
      "% Complete";


    document.getElementById("remaining").textContent =
      daysRemaining +
      " Days Remaining";


    document.getElementById("progressBar").style.width =
      percentage + "%";

  </script>

</body>
</html>
