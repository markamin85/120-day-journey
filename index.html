<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>120 Day Journey</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
      padding: 50px 20px;
    }

    h1 {
      font-size: 36px;
    }

    .dates {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.7;
    }

    #day {
      font-size: 28px;
      font-weight: bold;
      margin-top: 30px;
    }

    #percentage {
      font-size: 22px;
      margin-top: 15px;
    }

    .road-container {
  width: 90%;
  max-width: 800px;
  margin: 50px auto;
}

.road {
  position: relative;
  height: 50px;
  background-color: #444;
  border-radius: 10px;
  overflow: visible;
}

/* White dashed center line */
.road::after {
  content: "";
  position: absolute;
  top: 23px;
  left: 0;
  width: 100%;
  height: 4px;
  z-index: 2;

  background: repeating-linear-gradient(
    to right,
    white 0px,
    white 30px,
    transparent 30px,
    transparent 55px
  );
}

/* Completed portion of road */
.road-progress {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;

  height: 100%;
  width: 0%;

  background-color: #4caf50;
  border-radius: 10px 0 0 10px;

  transition: width 1s ease;
}

/* Person moving along road */
.walker {
  position: absolute;

  top: -42px;
  left: 0%;

  font-size: 36px;

  transform: translateX(-50%) scaleX(-1);

  transition: left 1s ease;
  z-index: 3;
}

.road-labels {
  display: flex;
  justify-content: space-between;

  margin-top: 12px;

  font-size: 14px;
  font-weight: bold;
}
    #remaining {
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>120 Day Journey</h1>

  <div class="dates">
    <div id="startDate"></div>
    <div id="endDate"></div>
  </div>

  <div id="day"></div>

  <div id="percentage"></div>

  <div class="road-container">

  <div class="road">
    <div class="road-progress" id="roadProgress"></div>

    <div class="walker" id="walker">
      🚶
    </div>
  </div>

  <div class="road-labels">
    <span>START</span>
    <span>FINISH 🏁</span>
  </div>

</div>

  <div id="remaining"></div>


  <script>

    // -------------------------
    // SETTINGS
    // -------------------------

    const TOTAL_DAYS = 120;

    const START_YEAR = 2026;

    // JavaScript months start at 0
    // January = 0
    // September = 8
    const START_MONTH = 8;

    const START_DAY = 20;


    // -------------------------
    // CREATE START DATE
    // -------------------------

    const startDate = new Date(
      START_YEAR,
      START_MONTH,
      START_DAY
    );


    // -------------------------
    // CALCULATE END DATE
    // -------------------------

    const endDate = new Date(startDate);

    // Day 1 is Sept 13, so Day 120 is
    // 119 days after the start date.
    endDate.setDate(
      endDate.getDate() + TOTAL_DAYS - 1
    );


    // -------------------------
    // GET TODAY'S DATE
    // -------------------------

    const today = new Date();


    // -------------------------
    // CONVERT DATES TO UTC
    // -------------------------

    const startUTC = Date.UTC(
      startDate.getFullYear(),
      startDate.getMonth(),
      startDate.getDate()
    );

    const todayUTC = Date.UTC(
      today.getFullYear(),
      today.getMonth(),
      today.getDate()
    );


    // -------------------------
    // CALCULATE DAYS
    // -------------------------

    const millisecondsPerDay =
      1000 * 60 * 60 * 24;


    let daysElapsed = Math.floor(
      (todayUTC - startUTC) /
      millisecondsPerDay
    );


    if (daysElapsed < 0) {
      daysElapsed = 0;
    }


    if (daysElapsed > TOTAL_DAYS) {
      daysElapsed = TOTAL_DAYS;
    }


    const currentDay =
      Math.min(
        daysElapsed + 1,
        TOTAL_DAYS
      );


    const percentage =
      (daysElapsed / TOTAL_DAYS) * 100;


    const daysRemaining =
      TOTAL_DAYS - daysElapsed;


    // -------------------------
    // FORMAT DATES
    // -------------------------

    const dateOptions = {
      month: "long",
      day: "numeric",
      year: "numeric"
    };


    // -------------------------
    // DISPLAY
    // -------------------------

    document.getElementById("startDate").textContent =
      "Start: " +
      startDate.toLocaleDateString(
        "en-US",
        dateOptions
      );


    document.getElementById("endDate").textContent =
      "Day 120: " +
      endDate.toLocaleDateString(
        "en-US",
        dateOptions
      );


    document.getElementById("day").textContent =
      "Day " +
      currentDay +
      " of " +
      TOTAL_DAYS;


    document.getElementById("percentage").textContent =
      percentage.toFixed(1) +
      "% Complete";


    document.getElementById("remaining").textContent =
      daysRemaining +
      " Days Remaining";

document.getElementById("roadProgress").style.width =
  percentage + "%";

document.getElementById("walker").style.left =
  percentage + "%";

  </script>

</body>
</html>
