<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>60 Day Journey</title>

  

  <!-- Connect this page to style.css -->
  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       BIBLE VERSE
  ========================== -->

  <div class="verse">

    <div class="verse-text">
      “Without Me you can do nothing.”
    </div>

    <div class="verse-reference">
      John 15:5
    </div>

  </div>



  <!-- =========================
       TITLE
  ========================== -->

  <h1>
    60 Day Journey
  </h1>

<div class="auth-section">

  <button id="signInButton">
    Sign in with Google
  </button>

  <div id="userStatus">
    Not signed in
  </div>

</div>

  <!-- =========================
       START AND END DATES
  ========================== -->

  <div class="dates">

    <div id="startDate"></div>

    <div id="endDate"></div>

  </div>



  <!-- =========================
       CURRENT DAY
  ========================== -->

  <div id="day"></div>



  <!-- =========================
       PERCENT COMPLETE
  ========================== -->

  <div id="percentage"></div>



  <!-- =========================
       ROAD
  ========================== -->

  <div class="road-container">


    <div class="road">


      <!-- Green completed portion -->
      <div
        class="road-progress"
        id="roadProgress">
      </div>


      <!-- Moving person -->
      <div
        class="walker"
        id="walker">
        🚶
      </div>


      <!-- Cross at destination -->
      <div class="cross">
        ✝
      </div>


    </div>



    <!-- Start and finish labels -->

    <div class="road-labels">

      <span>
        START
      </span>

      <span id="finishLabel"></span>

    </div>



    <!-- Spiritual reminder -->

    <div class="destination-message">
      Trust God
    </div>


  </div>



  <!-- =========================
       DAYS REMAINING
  ========================== -->

  <div id="remaining"></div>




  <!-- =========================
     DAILY CHECKLIST
========================== -->

<section class="checklist-section">

  <h2>Today's Checklist</h2>

  <div id="checklistDate"></div>


  <!-- MORNING -->

  <div class="checklist-group">

    <h3>Morning Activation</h3>

    <label>
      <input type="checkbox" id="morningTeeth">
      Morning Teeth
    </label>

    <label>
      <input type="checkbox" id="morningExercise">
      Morning Push-ups &amp; Squats
    </label>

    <label>
      <input type="checkbox" id="morningPrayer">
      Morning Prayer (2 mins)
    </label>

    <label>
      <input type="checkbox" id="morningJournal">
      Morning Journaling (2 mins)
    </label>

  </div>


  <!-- NIGHT -->

  <div class="checklist-group">

    <h3>Night Shutdown</h3>

    <label>
      <input type="checkbox" id="screensCar">
      Screens locked in car
    </label>

    <label>
      <input type="checkbox" id="nightTeeth">
      Night Teeth
    </label>

    <label>
      <input type="checkbox" id="nightExercise">
      Night Push-ups &amp; Squats
    </label>

    <label>
      <input type="checkbox" id="nightPrayer">
      Night Prayer (2 mins)
    </label>

    <label>
      <input type="checkbox" id="nightJournal">
      Night Journaling (2 mins)
    </label>

  </div>


  <!-- DAILY PROGRESS -->

  <div class="daily-progress">

    <div id="dailyProgressText">
      0 of 9 completed
    </div>

    <div class="daily-progress-container">

      <div
        class="daily-progress-bar"
        id="dailyProgressBar">
      </div>

    </div>

    <div id="dailyPercentage">
      0%
    </div>

  </div>
<div class="history-link">

  <a href="history.html">
    View History
  </a>

</div>
</section>
  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <!-- Connect this page to script.js -->

  <script type="module" src="script.js"></script>


</body>

</html>
