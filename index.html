<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>60 Day Journey</title>

  

  <!-- Connect this page to style.css -->
  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =========================
       BIBLE VERSE
  ========================== -->

  <div class="verse">

    <div class="verse-text">
      “Without Me you can do nothing.”
    </div>

    <div class="verse-reference">
      John 15:5
    </div>

  </div>



  <!-- =========================
       TITLE
  ========================== -->

  <h1>
    60 Day Journey
  </h1>

<div class="auth-section">

  <button id="signInButton">
    Sign in with Google
  </button>

  <div id="userStatus">
    Not signed in
  </div>

</div>

  <!-- =========================
       START AND END DATES
  ========================== -->

  <div class="dates">

    <div id="startDate"></div>

    <div id="endDate"></div>

  </div>



  <!-- =========================
       CURRENT DAY
  ========================== -->

  <div id="day"></div>



  <!-- =========================
       PERCENT COMPLETE
  ========================== -->

  <div id="percentage"></div>



  <!-- =========================
       ROAD
  ========================== -->

  <div class="road-container">


    <div class="road">


      <!-- Green completed portion -->
      <div
        class="road-progress"
        id="roadProgress">
      </div>


      <!-- Moving person -->
      <div
        class="walker"
        id="walker">
        🚶
      </div>


      <!-- Cross at destination -->
      <div class="cross">
        ✝
      </div>


    </div>



    <!-- Start and finish labels -->

    <div class="road-labels">

      <span>
        START
      </span>

      <span id="finishLabel"></span>

    </div>



    <!-- Spiritual reminder -->

    <div class="destination-message">
      Trust God
    </div>


  </div>



  <!-- =========================
       DAYS REMAINING
  ========================== -->

  <div id="remaining"></div>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <!-- Connect this page to script.js -->

  <script type="module" src="script.js"></script>


</body>

</html>
